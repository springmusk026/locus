    versionCode: 73
    commit: 2d3aba8e2c7558dbf16a380c92b115f67b28f203
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y gawk make python3 curl cmake ninja-build
    gradle:
      - yes
    binary: 
      https://github.com/springmusk026/locus/releases/download/v%v/locus-v%v-arm64-v8a.apk
    srclibs:
      - termux-proot@4dba3afbf3a63af89b4d9c1a59bf2bda10f4d10f
      - llama-cpp@713319e28492d319b81e49646151f6bbdb9d4551
    rm:
      - core/linux/src/main/jniLibs/arm64-v8a/libproot.so
      - core/linux/src/main/jniLibs/arm64-v8a/libproot-loader.so
      - core/linux/src/main/jniLibs/x86_64/libproot.so
      - core/linux/src/main/jniLibs/x86_64/libproot-loader.so
      - core/ondevice/src/main/jniLibs
    scanignore:
      - bench/tasks/multi/organize-inbox/workspace/inbox/archive.tar.gz
    build:
      - PROOT_SRC=$$termux-proot$$ ANDROID_NDK_HOME=$$NDK$$ bash 
        ../tools/build-proot.sh
      - LLAMA_SRC=$$llama-cpp$$ ANDROID_NDK_HOME=$$NDK$$ ABIS=arm64-v8a bash 
        ../tools/build-llama.sh
    ndk: 29.0.14206865
    gradleprops:
      - locus.abi=arm64-v8a
      - locus.unsigned=true

