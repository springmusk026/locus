kover = "0.9.11"
# Instrumentation tests (app/src/androidTest, docs/TESTING.md). Newest stable releases on Google Maven,
# checked 2026-11-01: AndroidX Test runner/rules/core 1.7.0, ext-junit 1.3.0 and espresso 3.7.0
# (2025-07-30), orchestrator 1.6.1 (2025-08-01), test-services 1.6.0 (2025-07-30), UiAutomator 2.4.0
# (2026-07-01). The 1.8.0 / 1.7.0 alpha lines are skipped. Hilt testing follows hilt, work-testing
# follows work, and Compose ui-test follows the Compose BOM.
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestOrchestrator = "1.6.1"
