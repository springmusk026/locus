// Used only by .github/workflows/osv-scanner.yml (docs/design/ci.md, "Dependency scanning").
//
// Writes what the release APK ships, app/build/osv/gradle.lockfile, in Gradle's lockfile format
// (`group:name:version=configuration`), so osv-scanner can check the exact resolved versions. The repo
// doesn't use Gradle dependency locking, and gradle/verification-metadata.xml lists every version
// Gradle ever downloads (build tools, lint, tests, and versions that lost conflict resolution), so
// neither says what's in the app. Nothing here changes the build.
allprojects {
    if (path != ":app") return
    tasks.register("writeOsvLockfile") {
        notCompatibleWithConfigurationCache("resolves a configuration at execution time")
        def out = layout.buildDirectory.file("osv/gradle.lockfile")
        outputs.file(out)
        doLast {
            def name = "releaseRuntimeClasspath"
            def lines = new TreeSet<String>()
            project.configurations.getByName(name).incoming.resolutionResult.allComponents.each { c ->
                def id = c.id
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                    lines << "${id.group}:${id.module}:${id.version}=$name".toString()
                }
            }
            def file = out.get().asFile
            file.parentFile.mkdirs()
            file.text = "# Generated by gradle/osv/runtime-lockfile.init.gradle for osv-scanner.\n" + lines.join("\n") + "\nempty=\n"
            logger.lifecycle("writeOsvLockfile: ${lines.size()} modules in $name -> $file")
        }
    }
}
