// Classes the Compose compiler should treat as stable (compared with equals()), passed to every
// Compose module by the locus.android.compose convention plugin. See docs/design/transcript-reads.md.
//
// Only small, immutable data classes (all val, of immutable types) from modules built without the
// Compose compiler (core:model, core:data) belong here, and only ones composables take as parameters.
// Classes holding large collections stay out: under strong skipping they are compared by identity,
// and the chat screen keeps unchanged instances across emissions (InstanceKeeper) so that is enough.
// Listing a class that can change after it's built breaks recomposition; check before adding one.

// core:model — message parts and reply metadata shown in transcript rows
dev.locus.core.model.Part.Attachment
dev.locus.core.model.Part.ToolCall
dev.locus.core.model.Part.ToolResult
dev.locus.core.model.TokenUsage
dev.locus.core.model.ReplyInfo
dev.locus.core.model.TodoItem
// A message's alternatives: an index and a few sibling ids.
dev.locus.core.model.Branch
dev.locus.core.model.ProposedPlan
dev.locus.core.model.Verification.Command
dev.locus.core.model.Verification.Outcome

// core:data — one changed path in a changes card
dev.locus.core.data.repository.TrackedChange
