<html><head><title>Ledger</title></head><body><main><h1>Ledger API</h1><p><code>GET /api/transactions</code> returns <code>{"data": [...], "next_cursor": "..."}</code>; pass <code>?cursor=</code> with the last <code>next_cursor</code> to get the next page. <code>next_cursor</code> is null on the last page. Amounts are in EUR; refunds are negative. <code>status</code> is settled, pending or failed.</p></main></body></html>
