<!doctype html>
<html><body>
<h1>How to order</h1>
<p>Send a POST request to <code>/api/orders</code> with a JSON body:</p>
<pre>{"sku": "&lt;product SKU&gt;", "qty": &lt;number&gt;, "email": "&lt;your email&gt;"}</pre>
<p>Use the header <code>Content-Type: application/json</code>. The reply contains your order number.
Each request places a new order.</p>
</body></html>
