name: Feature request
description: Suggest something Locus should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/ROADMAP.md](https://github.com/springmusk026/locus/blob/main/docs/ROADMAP.md) first: it may already be planned or decided against.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Mention what it should ask before doing, if anything.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered
      description: Workarounds, or how other apps do it.
  - type: checkboxes
    id: principles
    attributes:
      label: Fits Locus's principles
      description: See CONTRIBUTING.md, "Principles".
      options:
        - label: It works without a Locus server, telemetry or an AccessibilityService.
