name: Release

# Push a tag like v0.1.0 (or run it by hand) to publish a debug APK as a GitHub pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LOCUS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/locus.jks"
            echo "LOCUS_KEYSTORE_FILE=$RUNNER_TEMP/locus.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=Locus's release key" >> "$GITHUB_ENV"
          else
            echo "::warning::LOCUS_KEYSTORE_B64 is not set; signing with a throwaway debug key."
            echo "SIGNED_WITH=a temporary debug key (this APK won't update over other releases)" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          LOCUS_KEYSTORE_PASSWORD: ${{ secrets.LOCUS_KEYSTORE_PASSWORD }}
          LOCUS_KEY_ALIAS: ${{ secrets.LOCUS_KEY_ALIAS }}
        run: |
          export LOCUS_VERSION_NAME="${TAG#v}"
          export LOCUS_VERSION_CODE="${{ github.run_number }}"
          ./gradlew testDebugUnitTest :core:agent:test :core:llm:test :core:model:test :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/locus-${TAG}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Debug build of Locus ${TAG}, for testing. Signed with ${SIGNED_WITH}.

          **Install:** download \`locus-${TAG}-debug.apk\` below and open it on an Android 8.0+ phone (allow installs from your browser or file manager when asked). Check it against \`SHA256SUMS.txt\` if you like.

          Debug builds are larger and slower than release builds, and may change how data is stored between versions. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md) for what's in it.
          NOTES
          gh release create "$TAG" dist/* --prerelease --title "Locus ${TAG} (debug)" --notes-file notes.md --generate-notes --target "${{ github.sha }}"
