name: CI

# Four Gradle jobs run side by side (unit tests + coverage, lint, debug APK, release APK with R8), and
# one small `build` job needs them all, so branch protection and the merge tooling still see a single
# `build` check. Draft PRs and docs-only PRs skip the Gradle jobs; `build` still reports. Main is not
# rebuilt on push (it gets the tree its PR was tested with); a nightly run on main is the safety net.
# Why each choice: docs/design/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the PR touches anything but docs. A workflow-level paths-ignore would leave the required
  # `build` check pending forever on a docs-only PR; a job skipped by `if:` reports success instead.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "Not a pull request: run everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
          cat files.txt
          # The files API lists at most 3000 files; past that, don't guess.
          # Docs only: anything under docs/, or a Markdown file at the top level (README, CHANGELOG...).
          if [ "$(wc -l < files.txt)" -ge 3000 ] || grep -qvE '^docs/|^[^/]+\.md$' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: the Gradle jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  gradle:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Let every job finish so one failure doesn't hide another.
      fail-fast: false
      matrix:
        include:
          # Kover instruments these test runs; no thresholds yet.
          - name: unit-tests
            tasks: testDebugUnitTest :core:agent:test :core:llm:test :core:model:test :koverHtmlReportUnit :koverXmlReportUnit
            ndk: false
            artifact: coverage
            artifact-path: build/reports/kover/
          - name: lint
            tasks: lintDebug
            ndk: false
          - name: debug-apk
            tasks: :app:assembleDebug
            ndk: true
            artifact: locus-debug-apk
            artifact-path: app/build/outputs/apk/debug/app-*-debug.apk
          # R8 only runs for release builds, so a missing keep rule (a class found by name at run time)
          # would otherwise only show on a phone. verifyReleaseR8KeptNames runs with it and checks
          # app/r8-kept-names.txt against the mapping. One ABI is enough: R8 runs once for all of them.
          # Its APK (signed with the runner's debug key) is kept so a local or F-Droid build of the same
          # commit can be compared with a Linux build; docs/FDROID.md, "Reproducible builds".
          - name: release-r8
            tasks: :app:assembleRelease -Plocus.abi=arm64-v8a
            ndk: true
            artifact: locus-release-arm64-v8a-debugkey
            artifact-path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle User Home, including the local build cache (org.gradle.caching in
      # gradle.properties). Written only from main (the nightly run); PRs read it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # core:terminal builds libtermux.so with this NDK (ndkVersion there; docs/design/terminal.md).
      # Only APK builds run ndk-build; unit tests and lint don't. A fresh install takes ~10 s, less
      # than restoring a cached NDK would.
      - name: Install NDK
        if: matrix.ndk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null

      - name: Gradle
        run: ./gradlew ${{ matrix.tasks }}

      - if: matrix.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.name }}
          path: '**/build/reports/'
          retention-days: 7

  # The one required check. Skipped (so not blocking) while the PR is a draft; otherwise it fails
  # unless every Gradle job passed, or they were all skipped for a docs-only change.
  build:
    needs: [changes, gradle]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GRADLE: ${{ needs.gradle.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), gradle jobs: $GRADLE"
          if [ "$CHANGES" != success ]; then echo "::error::The changes job did not succeed."; exit 1; fi
          if [ "$CODE" = false ] && [ "$GRADLE" = skipped ]; then echo "Docs only."; exit 0; fi
          if [ "$GRADLE" != success ]; then echo "::error::A Gradle job did not succeed."; exit 1; fi
