name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:agent:test :core:llm:test :core:model:test

      # Reuses the test results above (Kover instruments those runs); no thresholds yet.
      - name: Coverage report
        run: ./gradlew :koverHtmlReportUnit :koverXmlReportUnit

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: build/reports/kover/
          retention-days: 14

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: locus-debug-apk
          path: app/build/outputs/apk/debug/app-*-debug.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
