name: CI

# Four Gradle jobs run side by side (unit tests + coverage, lint, debug APK, release APK with R8), and
# one small `build` job needs them all, so branch protection and the merge tooling still see a single
# `build` check. Draft PRs and docs-only PRs skip the Gradle jobs; `build` still reports. A PR runs only
# the jobs its files need (screenshots for UI changes, release-r8 for app and build changes). Main is
# not rebuilt on push (it gets the tree its PR was tested with); a nightly run on main is the safety net,
# and it runs only when main changed since the night before. Actions minutes are limited: why each
# choice, docs/design/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the PR touches anything but docs. A workflow-level paths-ignore would leave the required
  # `build` check pending forever on a docs-only PR; a job skipped by `if:` reports success instead.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every Gradle job. unit-tests: unitTests is every module's JVM unit tests (the convention
          # plugins register it, so a new module is in it); Kover instruments these runs (no thresholds
          # yet); the screenshot tests run here too but draw nothing. screenshots: every module's
          # screenshot tests draw into build/ and the render guard checks contrast and raw ids; no
          # goldens, nothing uploaded (docs/design/design-system.md, "Review gate"). release-r8: R8 runs
          # only for release builds, so a missing keep rule would otherwise only show on a phone;
          # verifyReleaseR8KeptNames checks app/r8-kept-names.txt; one ABI is enough, and its APK
          # (runner's debug key) is kept for reproducible-build comparisons (docs/FDROID.md).
          # robolectric: the job runs Robolectric tests.
          MATRIX='[
            {"name":"unit-tests","tasks":"unitTests :koverHtmlReportUnit :koverXmlReportUnit","ndk":false,"robolectric":true,"artifact":"coverage","artifact-path":"build/reports/kover/"},
            {"name":"screenshots","tasks":"recordRoborazziDebug","ndk":false,"robolectric":true},
            {"name":"lint","tasks":"lintDebug","ndk":false,"robolectric":false},
            {"name":"debug-apk","tasks":":app:assembleDebug","ndk":true,"robolectric":false,"artifact":"locus-debug-apk","artifact-path":"app/build/outputs/apk/debug/app-*-debug.apk"},
            {"name":"release-r8","tasks":":app:assembleRelease -Plocus.abi=arm64-v8a","ndk":true,"robolectric":false,"artifact":"locus-release-arm64-v8a-debugkey","artifact-path":"app/build/outputs/apk/release/app-arm64-v8a-release.apk"}
          ]'
          pick() { echo "matrix=$(jq -c --argjson want "$1" '{include: [.[] | select(.name as $n | $want | index($n))]}' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"; }
          if [ -z "$PR" ]; then
            # The nightly run checks main only when main changed in the last day: a night with no merge
            # would repeat the previous night's run on the same tree. Manual runs always run.
            if [ "$EVENT" = schedule ]; then
              since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
              n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=${GITHUB_REF_NAME}&since=$since&per_page=1" --jq length)
              if [ "$n" = 0 ]; then
                echo "No commits on main since $since: nothing to check tonight."
                echo "code=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "Not a pull request: run everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            pick '["unit-tests","screenshots","lint","debug-apk","release-r8"]'
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
          cat files.txt
          # The files API lists at most 3000 files; past that, don't guess.
          many=$([ "$(wc -l < files.txt)" -ge 3000 ] && echo yes || echo no)
          # Docs only: anything under docs/, or a Markdown file at the top level (README, CHANGELOG...).
          if [ "$many" = no ] && ! grep -qvE '^docs/|^[^/]+\.md$' files.txt; then
            echo "Docs-only change: the Gradle jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "code=true" >> "$GITHUB_OUTPUT"
          # Build setup changes everything; so does this file.
          setup='^gradle/|\.gradle\.kts$|^build-logic/|^gradle\.properties$|^\.github/workflows/ci\.yml$'
          jobs='"unit-tests","lint","debug-apk"'
          # Screenshots: a change that can alter what a screen draws (feature screens, the design system,
          # shared UI, resources) or the screenshot tests themselves. Pure logic in core modules can't.
          if [ "$many" = yes ] || grep -qE "$setup|^feature/|^core/designsystem/|^core/ui/|^core/markdown/|^app/|/src/main/res/|Screenshots?\.kt$" files.txt; then
            jobs="$jobs,\"screenshots\""
          fi
          # Release with R8: the app module, keep rules, the kept-names list, or build setup. Code in other
          # modules is still checked by R8 in the nightly run on main and in every release build.
          if [ "$many" = yes ] || grep -qE "$setup|^app/|proguard|\.pro$|r8" files.txt; then
            jobs="$jobs,\"release-r8\""
          fi
          pick "[$jobs]"
          echo "Jobs for this PR: [$jobs]"

  gradle:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Let every job finish so one failure doesn't hide another.
      fail-fast: false
      # Built by the changes job: only the jobs this change needs (the full list and why each job exists
      # are there, in MATRIX). fail-fast is off so one failure doesn't hide another.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle User Home, including the local build cache (org.gradle.caching in
      # gradle.properties). Written only from main (the nightly run); PRs read it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # core:terminal builds libtermux.so with this NDK (ndkVersion there; docs/design/terminal.md), read
      # from its one definition in gradle/libs.versions.toml. Only APK builds run ndk-build; unit tests
      # and lint don't. A fresh install takes ~10 s, less than restoring a cached NDK would.
      - name: Install NDK
        if: matrix.ndk
        run: |
          NDK_VERSION=$(sed -nE 's/^ndk = "([^"]+)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$NDK_VERSION" ]; then echo "::error::No ndk = \"...\" line in gradle/libs.versions.toml."; exit 1; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      # Robolectric fetches its android-all jars from Maven Central into ~/.m2 on first use; a failed
      # fetch failed whole test classes (MavenArtifactFetcher). Cached by the dependency versions file,
      # so a run downloads them only after a Robolectric or SDK change.
      - name: Robolectric jars
        if: matrix.robolectric
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Gradle
        run: ./gradlew ${{ matrix.tasks }}

      - if: matrix.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.name }}
          # Test and lint reports only: never a screenshot (Roborazzi's report folder holds images).
          path: |
            **/build/reports/
            !**/build/reports/roborazzi/
          retention-days: 7

  # The one required check. Skipped (so not blocking) while the PR is a draft; otherwise it fails
  # unless every Gradle job passed, or they were all skipped for a docs-only change.
  build:
    needs: [changes, gradle]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GRADLE: ${{ needs.gradle.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), gradle jobs: $GRADLE"
          if [ "$CHANGES" != success ]; then echo "::error::The changes job did not succeed."; exit 1; fi
          if [ "$CODE" = false ] && [ "$GRADLE" = skipped ]; then echo "Docs only."; exit 0; fi
          if [ "$GRADLE" != success ]; then echo "::error::A Gradle job did not succeed."; exit 1; fi
