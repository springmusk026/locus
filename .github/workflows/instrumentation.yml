# Instrumentation tests (app/src/androidTest) on an Android emulator. See docs/TESTING.md.
#
# Not part of PR CI: an emulator boot plus a test process per test (the orchestrator) takes
# 20-40 minutes and emulators on shared runners are slower and less predictable than the JVM suite.
# It runs nightly and on demand (Actions → Instrumentation tests → Run workflow, optionally on a
# branch). Make it required only once it has been green for a while.
name: Instrumentation tests

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The nightly run boots an emulator (the costliest minutes here), so it runs only when main changed in
  # the last day; manual runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=${GITHUB_REF_NAME}&since=$since&per_page=1" --jq length)
          if [ "$n" = 0 ]; then echo "No commits on main since $since: skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  emulator:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # API 35, Google APIs, x86_64: the newest image the emulator action installs by plain level
      # (API 37's package is android-37.0). Notifications need 33+; Live Updates (36+) aren't covered here.
      API_LEVEL: 35
      TARGET: google_apis
      ARCH: x86_64
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # core:terminal builds libtermux.so with this NDK (ndkVersion there; docs/design/terminal.md), read
      # from its one definition in gradle/libs.versions.toml.
      - name: Install NDK
        run: |
          NDK_VERSION=$(sed -nE 's/^ndk = "([^"]+)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$NDK_VERSION" ]; then echo "::error::No ndk = \"...\" line in gradle/libs.versions.toml."; exit 1; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      # Hardware acceleration on GitHub's Linux runners (the emulator action's README;
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # The revision of the system image the emulator runs: the installed one if the runner has it, else
      # the newest sdkmanager offers, which the emulator action installs (sdkmanager lists installed
      # packages first). In the cache key, so a new image revision makes a new snapshot instead of
      # restoring one taken on an older image.
      - name: System image revision
        id: image
        run: |
          PKG="system-images;android-$API_LEVEL;$TARGET;$ARCH"
          REV=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | awk -F'|' -v pkg="$PKG" '{ gsub(/ /, "", $1); gsub(/ /, "", $2) } $1 == pkg { print $2; exit }')
          if [ -z "$REV" ]; then echo "::error::sdkmanager doesn't list $PKG."; exit 1; fi
          echo "$PKG: revision $REV"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      # A booted AVD snapshot, so later runs skip the cold boot.
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ steps.image.outputs.revision }}

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot created."

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
