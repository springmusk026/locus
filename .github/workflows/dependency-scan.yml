name: Dependency scan

# Known vulnerabilities in the Gradle dependencies (docs/design/ci.md, "Dependency scanning").
#
# - `lockfile` writes what the release APK ships (:app's releaseRuntimeClasspath, every module's
#   dependencies resolved) as a Gradle lockfile; the repo doesn't use dependency locking, so there is
#   none to read. gradle/osv/runtime-lockfile.init.gradle does it without changing the build.
# - `osv-scanner` runs Google's reusable OSV-Scanner workflow on that lockfile and on
#   gradle/verification-metadata.xml, which lists every artifact Gradle downloads: build plugins, lint
#   and test libraries too, and versions that lost conflict resolution. It reports and never fails on
#   a finding (fail-on-vuln: false): the first scan wasn't clean (docs/design/ci.md). Results go to the
#   job log and a SARIF artifact on every run, and to Security → Code scanning from main only: uploaded
#   from a pull request, every existing finding would show as new there.
# - `dependency-graph` submits the shipped runtime dependencies to GitHub's dependency graph each week.
#   GitHub can't read Gradle builds statically, so without it Dependabot alerts and security updates
#   see none of the Gradle dependencies. Pull requests only generate it, to check that it still works.
#
# This workflow isn't part of CI's `build` check, so it never blocks a merge.
# Actions are pinned by commit SHA, with the version in a comment; Dependabot updates them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "gradle/**"
      - "**/*.gradle.kts"
      - "build-logic/**"
      - "gradle.properties"
      - ".github/workflows/dependency-scan.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lockfile:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Write the release runtime lockfile
        run: ./gradlew -I gradle/osv/runtime-lockfile.init.gradle :app:writeOsvLockfile

      # Downloaded by the scan into the root of its checkout, as ./gradle.lockfile.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-lockfile
          path: app/build/osv/gradle.lockfile
          retention-days: 5

  osv-scanner:
    needs: lockfile
    permissions:
      # What the reusable workflow's job asks for: reading the run's artifacts and uploading SARIF.
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: osv-lockfile
      scan-args: |-
        --lockfile=gradle.lockfile
        --lockfile=gradle/verification-metadata.xml
      fail-on-vuln: false
      upload-sarif: ${{ github.event_name != 'pull_request' }}

  # Two jobs because permissions can't depend on the event: only the scheduled or manual run on main
  # may write. A pull request generates the graph with read-only access, to check that it still works.
  dependency-graph-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-upload
          dependency-graph-include-projects: '^:app$'
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          artifact-retention-days: 5

  dependency-graph:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # The dependency submission API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit
          # What ships, not build tools or test libraries: those are in the OSV scan's report.
          dependency-graph-include-projects: '^:app$'
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
