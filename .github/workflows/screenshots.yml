name: Record screenshots

# Records every screenshot golden on Linux, the platform CI verifies on, and uploads them as an
# artifact. Run it on a branch whose goldens don't match on CI (Robolectric draws text with the host's
# Skia, so a golden recorded on macOS can differ by a few anti-aliased pixels), download the
# artifact, and commit its src/test/screenshots folders. docs/design/design-system.md, "Review gate".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Record
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: '**/src/test/screenshots/'
          retention-days: 7
